name: podcast-digest

on:
  schedule:
    - cron: '0 9 * * *'     # 台北每天 17:00；GitHub 排程常延遲約 10 分鐘
  workflow_dispatch:
    inputs:
      dryrun:
        description: '只偵測新集數，不轉錄、不寄信'
        type: boolean
        default: false
      only:
        description: '測試用：只處理名稱含此字串的節目'
        type: string
        default: ''
      limit:
        description: '測試用：最多處理幾集（0 = 不限）'
        type: string
        default: '0'
      max_age_h:
        description: '測試用：首次出現的節目回溯多少小時（空白 = 36）'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: podcast-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]   # 兩個 job 並行轉錄，待處理集數依長度平均分攤（見 digest.py 的 SHARD）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        # 不裝 apt 的 ffmpeg：10/22 首跑時 apt 卡了 21 分鐘；音檔由 faster-whisper 內建的 PyAV 解碼
        run: pip install -q -r requirements.txt

      - name: 快取 Whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo

      - name: 偵測、轉錄、寄逐字稿
        id: digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRYRUN: ${{ inputs.dryrun && '1' || '0' }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit || '0' }}
          MAX_AGE_H: ${{ inputs.max_age_h || '36' }}
          TIME_BUDGET_MIN: '300'
          SHARD: ${{ matrix.shard }}/2
        run: python digest.py

      - name: 上傳本分片的已處理清單
        # digest.py 每完成一集就存一次，所以即使本 job 中途失敗，已完成的集數也會被記下
        if: always() && inputs.dryrun != true
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.shard }}
          path: state/seen.json
          if-no-files-found: ignore
          retention-days: 3

  finalize:
    # 合併各分片的已處理清單並 commit。分片 job 失敗或被取消也要執行，才不會讓已寄出的集數隔天重轉。
    needs: digest
    if: always() && inputs.dryrun != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true   # 兩個分片都沒產出 artifact 時不要讓整個 job 失敗；merge_state.py 會當作 0 份處理
        with:
          pattern: state-*
          path: shard-state

      - name: 合併並存已處理清單
        run: |
          python3 merge_state.py state/seen.json shard-state
          git config user.name "podcast-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "已處理集數 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
