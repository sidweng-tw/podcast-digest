name: podcast-digest

on:
  schedule:
    - cron: '0 9 * * *'     # 台北每天 17:00；GitHub 排程常延遲約 10 分鐘
    - cron: '15 11 * * *'   # 台北 19:15 補跑：上一輪沒做完或失敗的集數
  workflow_dispatch:
    inputs:
      dryrun:
        description: '只偵測新集數，不轉錄、不寄信'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: podcast-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: |
          pip install -q -r requirements.txt
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: 快取 Whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo

      - name: 偵測、轉錄、寄逐字稿
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRYRUN: ${{ inputs.dryrun && '1' || '0' }}
          # 17:00 那輪最多轉 140 分鐘，19:15 補跑最多 45 分鐘，趕在 20:38 摘要排程之前收工；趕不上的集數併入隔天摘要
          TIME_BUDGET_MIN: ${{ github.event.schedule == '15 11 * * *' && '45' || '140' }}
        run: python digest.py

      - name: 存已處理清單
        if: always() && inputs.dryrun != true
        run: |
          git config user.name "podcast-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "已處理集數 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
