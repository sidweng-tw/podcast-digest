name: podcast-digest

on:
  schedule:
    - cron: '0 9 * * *'     # 台北每天 17:00；GitHub 排程常延遲約 10 分鐘
  workflow_dispatch:
    inputs:
      dryrun:
        description: '只偵測新集數，不轉錄、不寄信'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: podcast-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        # 不裝 apt 的 ffmpeg：10/22 首跑時 apt 卡了 21 分鐘；音檔由 faster-whisper 內建的 PyAV 解碼
        run: pip install -q -r requirements.txt

      - name: 快取 Whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo

      - name: 偵測、轉錄、寄逐字稿
        id: digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRYRUN: ${{ inputs.dryrun && '1' || '0' }}
          TIME_BUDGET_MIN: '300'
        run: python digest.py

      - name: 存已處理清單
        if: always() && inputs.dryrun != true
        run: |
          git config user.name "podcast-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "已處理集數 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
