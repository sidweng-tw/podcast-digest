name: podcast-digest

on:
  schedule:
    - cron: '0 9 * * *'     # 台北每天 17:00；GitHub 排程常延遲約 10 分鐘
  workflow_dispatch:
    inputs:
      dryrun:
        description: '只偵測新集數，不轉錄、不寄信'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: podcast-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: |
          pip install -q -r requirements.txt
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: 快取 Whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo

      - name: 偵測、轉錄、寄逐字稿
        id: digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRYRUN: ${{ inputs.dryrun && '1' || '0' }}
          TIME_BUDGET_MIN: '300'
        run: python digest.py

      - name: 存已處理清單
        if: always() && inputs.dryrun != true
        run: |
          git config user.name "podcast-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "已處理集數 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      # 摘要時間以 21:00 為參考：早轉完就等到 20:40 再觸發；晚轉完就轉完立刻觸發，不拖到隔天
      - name: 等到台北 20:40
        if: github.event_name == 'schedule' && steps.digest.outputs.done != '0'
        run: |
          now=$(TZ=Asia/Taipei date +%s); target=$(TZ=Asia/Taipei date -d '20:40' +%s)
          if [ "$now" -lt "$target" ]; then echo "等 $(( (target-now)/60 )) 分鐘"; sleep $((target-now)); fi

      - name: 觸發雲端摘要
        if: steps.digest.outputs.done != '0' && inputs.dryrun != true
        env:
          SUMMARY_FIRE_TOKEN: ${{ secrets.SUMMARY_FIRE_TOKEN }}
        run: python fire_summary.py
