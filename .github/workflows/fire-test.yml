name: fire-test
# 手動測試：只觸發雲端摘要任務（沒有未摘要的逐字稿時，任務不會寄信）
on:
  workflow_dispatch:
jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 觸發雲端摘要
        env:
          SUMMARY_FIRE_TOKEN: ${{ secrets.SUMMARY_FIRE_TOKEN }}
        run: python3 fire_summary.py
